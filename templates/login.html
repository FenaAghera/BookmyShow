{% extends "basic.html" %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
    .login-container {
        margin-top: 50px;
        margin-bottom: 50px;
    }
    .card {
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        border: none;
    }
    .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
    }
    .form-control {
        border-radius: 0;
        border-right: none;
    }
    .input-group-text {
        border-radius: 0;
        background-color: #f8f9fa;
        border-right: none;
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 25px;
        padding: 12px;
    }
</style>

<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-sign-in-alt"></i> Welcome Back!
                    </h4>
                    <small>Please login to continue</small>
                    {% if request.GET.next %}
                        <div class="mt-2">
                            <small><i class="fas fa-info-circle"></i> You'll be redirected after login</small>
                        </div>
                    {% endif %}
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="{{form.username.id_for_label}}">Username</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">
                                        <i class="fas fa-user"></i>
                                    </span>
                                </div>
                                {{form.username}}
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <label for="{{form.password.id_for_label}}">Password</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                </div>
                                {{form.password}}
                                <div class="input-group-append">
                                    <button type="button" class="btn btn-outline-secondary" id="togglepassword">
                                        <i class="fas fa-eye" id="toggleicon"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-light">
                    <small>Don't have an account? <a href="{% url 'register' %}" class="text-primary">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const togglePassword = document.getElementById('togglepassword');
        const passwordField = document.getElementById('{{form.password.id_for_label}}');
        const toggleIcon = document.getElementById('toggleicon');

        if (togglePassword && passwordField && toggleIcon) {
            togglePassword.addEventListener('click', function () {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                toggleIcon.classList.toggle('fa-eye');
                toggleIcon.classList.toggle('fa-eye-slash');
            });
        }
    });
</script>
{% endblock %}
